# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/frontend" # Location of package manifests
    schedule:
      interval: "weekly"
    # Match frontend/.npmrc's minimum-release-age (7 days): pnpm refuses newer releases
    cooldown:
      default-days: 7
    # ESLint plugins/configs share peer deps (e.g. vue-eslint-parser), so they
    # only install under strict-peer-dependencies when updated together
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@vue/eslint-config-*"
          - "vue-eslint-parser"
          - "typescript-eslint"
          - "@typescript-eslint/*"
    ignore:
      # Several ESLint plugins still peer-depend on eslint ^8 || ^9; revisit
      # (and drop this) once they support ESLint 10
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
